# Every push to main, every pull request, and on demand: formatting, lint,
# types, tests with coverage, a production build, the browser tests against
# that build in parallel shards, and the Docker image. Pushes to other
# branches run nothing of their own: their pull request already runs CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its run still going. Each run on
# main gets a group of its own (its run id), so none is ever cancelled or left
# waiting, and every commit on main keeps a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/leeway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: psql postgres://postgres@localhost:5432/postgres -c 'CREATE DATABASE leeway_test'
      - run: npm run check
      - run: npm run build

  # The browser tests, split by Playwright's --shard across machines. Each
  # shard has its own Postgres and server and runs setup.spec.ts for itself,
  # so no shard depends on another. Each uploads a blob report for `e2e`.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the others: their results still count.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: leeway_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/leeway_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers are cached by Playwright's version; their system
      # libraries are installed every time, which is quick.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      # The shard count is the matrix's size, so adding a shard is one entry above.
      - name: Run shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob,list
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  # One report of every shard, with screenshots and traces of any failure, and
  # one result: it fails when any shard failed or did not finish.
  e2e:
    needs: e2e-shard
    # always(), not !cancelled(): a skipped job counts as passed, so a cancelled
    # run must still reach the last step and fail here.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge the shards' reports
        run: npx playwright merge-reports --reporter=html,list ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Fail unless every shard passed
        if: ${{ needs.e2e-shard.result != 'success' }}
        run: |
          echo "A browser test shard failed or did not finish: ${{ needs.e2e-shard.result }}"
          exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leeway .
